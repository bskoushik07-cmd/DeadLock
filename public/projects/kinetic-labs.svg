<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0A0A0E"/>
  <defs>
    <radialGradient id="kl-glow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#C6FF3D" stopOpacity="0.25"/>
      <stop offset="100%" stopColor="#070709" stopOpacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="750" cy="400" r="350" fill="url(#kl-glow)"/>

  <!-- Telemetry Graphs -->
  <path d="M 100 600 L 250 580 L 380 620 L 520 480 L 640 510 L 780 320 L 920 380 L 1100 210" stroke="#C6FF3D" stroke-width="3" fill="none"/>
  <path d="M 100 600 L 250 580 L 380 620 L 520 480 L 640 510 L 780 320 L 920 380 L 1100 210 L 1100 700 L 100 700 Z" fill="url(#kl-glow)" opacity="0.3"/>

  <!-- Grid Crosshairs -->
  <line x1="780" y1="100" x2="780" y2="700" stroke="rgba(198,255,61,0.2)" stroke-dasharray="4 4"/>
  <circle cx="780" cy="320" r="8" fill="#C6FF3D"/>
  <circle cx="780" cy="320" r="18" stroke="#C6FF3D" stroke-width="1.5" opacity="0.6"/>

  <!-- Technical Monospace Labels -->
  <text x="80" y="100" fill="#8A8A93" font-family="monospace" font-size="14" letter-spacing="3">01 // KINETIC LABS TELEMETRY</text>
  <text x="80" y="130" fill="#F4F4F0" font-family="sans-serif" font-weight="900" font-size="48" letter-spacing="-1">HIGH-FREQUENCY RUNTIME</text>
  <text x="80" y="170" fill="#C6FF3D" font-family="monospace" font-size="14">LATENCY: 0.18MS // GPU BUFFER: ACTIVE</text>
</svg>
