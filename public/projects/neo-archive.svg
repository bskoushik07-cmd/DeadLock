<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0A0B10"/>
  <defs>
    <radialGradient id="neo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#00F0FF" stopOpacity="0.2"/>
      <stop offset="100%" stopColor="#070709" stopOpacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="600" cy="400" r="400" fill="url(#neo-glow)"/>

  <!-- 3D Geometric Cloth Contours -->
  <g stroke="#00F0FF" stroke-width="1.2" opacity="0.65" fill="none">
    <ellipse cx="600" cy="400" rx="420" ry="240" transform="rotate(-15 600 400)"/>
    <ellipse cx="600" cy="400" rx="360" ry="200" transform="rotate(-15 600 400)"/>
    <ellipse cx="600" cy="400" rx="300" ry="160" transform="rotate(-15 600 400)"/>
    <ellipse cx="600" cy="400" rx="240" ry="120" transform="rotate(-15 600 400)"/>
    <ellipse cx="600" cy="400" rx="180" ry="80" transform="rotate(-15 600 400)"/>
    <ellipse cx="600" cy="400" rx="120" ry="40" transform="rotate(-15 600 400)"/>
  </g>

  <!-- Fashion Typography -->
  <text x="80" y="100" fill="#8A8A93" font-family="monospace" font-size="14" letter-spacing="3">02 // NEO ARCHIVE EDITIONS</text>
  <text x="80" y="130" fill="#F4F4F0" font-family="sans-serif" font-weight="900" font-size="48" letter-spacing="-1">GENERATIVE CLOTH ENGINE</text>
  <text x="80" y="170" fill="#00F0FF" font-family="monospace" font-size="14">3D MESH TENSION // DIGITAL PROVENANCE</text>
</svg>
